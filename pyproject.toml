[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-backtest"
version = "0.1.0"
description = "Deterministic event replay and execution simulation for Kairos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-quant-scouts>=0.1,<0.2",
    "kairos-strategy-engine>=0.2,<0.3",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "91cd95c8e5bd4393ed04606df08c205583092df7" }
kairos-quant-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git", rev = "4e6553800facef0e014d5f3a2855ce774289b5e5" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "fc391fc630fa25970192bfce29be5c76e2cc09b7" }

[project.scripts]
kairos-evaluate = "kairos_backtest.cli:main"
kairos-development-screen = "kairos_backtest.development_screen:main"
kairos-orderflow-screen = "kairos_backtest.orderflow_screen:main"
kairos-quarter-hour-screen = "kairos_backtest.quarter_hour_screen:main"
kairos-right-tail-screen = "kairos_backtest.right_tail_screen:main"
kairos-crowded-trend-screen = "kairos_backtest.crowded_trend_screen:main"
kairos-regime-retest-screen = "kairos_backtest.regime_retest_screen:main"
kairos-market-anatomy = "kairos_backtest.market_anatomy:main"
kairos-factor-data = "kairos_backtest.factor_data:main"
kairos-derivatives-state = "kairos_backtest.factor_study:main"
kairos-validate-strategy = "kairos_backtest.validation_campaign:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_backtest"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["kairos_quant.*"]
ignore_missing_imports = true
