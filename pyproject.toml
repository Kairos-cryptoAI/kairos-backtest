[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-backtest"
version = "0.1.0"
description = "Deterministic event replay and execution simulation for Kairos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "kairos-quant-scouts>=0.1,<0.2",
    "kairos-strategy-engine>=0.1,<0.2",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "a4f427cdd44184fac62a842320133ac5a3e11fbe" }
kairos-quant-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git", rev = "8474a25bd0afa58f4182ea69aaa0af71c7a01643" }
kairos-strategy-engine = { git = "https://github.com/Kairos-cryptoAI/kairos-strategy-engine.git", rev = "b8db14829c56cc6f2061b4eee4e7c3d3e9e02b3e" }

[project.scripts]
kairos-evaluate = "kairos_backtest.cli:main"
kairos-development-screen = "kairos_backtest.development_screen:main"
kairos-orderflow-screen = "kairos_backtest.orderflow_screen:main"
kairos-regime-retest-screen = "kairos_backtest.regime_retest_screen:main"
kairos-validate-strategy = "kairos_backtest.validation_campaign:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_backtest"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["kairos_quant.*"]
ignore_missing_imports = true
