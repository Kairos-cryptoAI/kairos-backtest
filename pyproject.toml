[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-backtest"
version = "0.1.0"
description = "Deterministic event replay and execution simulation for Kairos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.2,<0.3",
    "kairos-quant-scouts>=0.1,<0.2",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "c2b9ba192521f9843b245e1eae8a501d408a6bfa" }
kairos-quant-scouts = { git = "https://github.com/Kairos-cryptoAI/kairos-quant-scouts.git", rev = "5e30222227dc1b723cdca2380672208e8bffb259" }

[project.scripts]
kairos-evaluate = "kairos_backtest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_backtest"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["kairos_quant.*"]
ignore_missing_imports = true
