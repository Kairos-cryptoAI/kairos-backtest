[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-backtest"
version = "0.1.0"
description = "Deterministic event replay and execution simulation for Kairos."
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = ["kairos-core>=0.1.0", "kairos-quant-scouts>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
kairos-evaluate = "kairos_backtest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_backtest"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
